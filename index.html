<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1e0b07 0%, #090302 100%);
        }

        #debugLog::-webkit-scrollbar {
            width: 6px;
        }

        #debugLog::-webkit-scrollbar-track {
            background: #111;
        }

        #debugLog::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .orbit {
            position: fixed;
            right: -60px;
            top: -20px;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            animation: orbit 40s linear infinite;
            pointer-events: none;
            z-index: -2
        }

        .nebula {
            position: fixed;
            inset: 0;
            z-index: -5;
            pointer-events: none;
            background: radial-gradient(circle at 20% 30%, rgba(255, 80, 40, .12), transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(80, 120, 255, .10), transparent 25%),
                radial-gradient(circle at 50% 80%, rgba(255, 255, 255, .05), transparent 20%)
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -4
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite
        }

        @keyframes twinkle {
            50% {
                opacity: .2;
            }
        }

        .stars-back,
        .stars-mid,
        .stars-front {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .stars-back {
            z-index: -6;
        }

        .stars-mid {
            z-index: -5;
        }

        .stars-front {
            z-index: -4;
        }

        .star-back,
        .star-mid,
        .star-front {
            position: absolute;
            border-radius: 50%;
            background: white;
        }

        .star-back,
        .star-mid,
        .star-front {
            position: absolute;
            border-radius: 50%;
            background: white;
        }

        .star-back {
            width: 1px;
            height: 1px;
        }

        .star-mid {
            width: 2px;
            height: 2px;
        }

        .star-front {
            width: 3px;
            height: 3px;
        }

        @keyframes twinkle {

            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }

        }

        .mars-glow {
            position: fixed;
            right: -40px;
            top: -40px;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -3;
            background: radial-gradient(circle, rgba(255, 120, 40, .18) 0%, rgba(255, 120, 40, .08) 35%, transparent 75%);
            filter: blur(45px);
        }

        section {
            transition: transform .25s ease, box-shadow .25s ease;
        }

        section:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 120, 40, .08);
        }


        .footer-socials {

            display: flex;
            justify-content: center;
            align-items: flex-end;

            gap: 18px;
        }

        .dock-icon {

            width: 58px;
            height: 58px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            position: relative;

            color: #9ca3af;

            text-decoration: none;

            transition:
                transform .25s ease,
                color .25s ease,
                filter .25s ease;
        }

        .dock-icon i {

            font-size: 30px;

            transition:
                transform .25s ease,
                color .25s ease;
        }

        .dock-icon::before {

            content: '';

            position: absolute;

            inset: 0;

            border-radius: 18px;

            opacity: 0;

            transition: .25s ease;

            z-index: -1;
        }



        .discord::before {
            background: #5865F2;
        }

        .discord:hover {
            color: #5865F2;
        }

        .discord:hover::before {
            opacity: .15;
        }



        .github::before {
            background: #ffffff;
        }

        .github:hover {
            color: #ffffff;
        }

        .github:hover::before {
            opacity: .12;
        }



        .x::before {
            background: #ffffff;
        }

        .x:hover {
            color: #ffffff;
        }

        .x:hover::before {
            opacity: .12;
        }



        .footer-socials:hover .dock-icon {

            transform: scale(.92);
        }

        .footer-socials .dock-icon:hover {

            transform:
                translateY(-16px) scale(1.28);

            filter:
                drop-shadow(0 0 18px rgba(255, 255, 255, .25));
        }

    <script>
        window.__earlyEIP6963Providers = window.__earlyEIP6963Providers || new Map();
        window.addEventListener("eip6963:announceProvider", event => {
            try {
                const detail = event?.detail;
                if (!detail?.provider || !detail?.info) return;
                const key = detail.info.uuid || detail.info.rdns || detail.info.name;
                if (key) window.__earlyEIP6963Providers.set(key, detail);
            } catch (e) { console.debug("Early EIP-6963 capture failed:", e); }
        }, false);
        window.dispatchEvent(new Event("eip6963:requestProvider"));
    </script>
    <script type="module">
        import { createClient } from "genlayer-js";
        import { studionet } from "genlayer-js/chains";
        import { TransactionStatus } from "genlayer-js/types";

        const CONTRACT_ADDRESS = "0x86b783a21EF1D1224346F9D11333E671dADDBDBf";

        let client = null;
        let userAccountAddress = null;
        let currentScenarioText = "";

        const connectBtn = document.getElementById('connectBtn');
        const generateBtn = document.getElementById('generateBtn');
        const submitBtn = document.getElementById('submitBtn');
        const debugLog = document.getElementById('debugLog');

        function logEvent(msg, type = "info") {
            const time = new Date().toLocaleTimeString();
            let color = "text-green-400";
            if (type === "error") color = "text-red-400";
            if (type === "success") color = "text-blue-400";
            if (type === "warning") color = "text-yellow-400";
            debugLog.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // ============================================================
        // MULTI WALLET SUPPORT
        // MetaMask + OKX + Rabby + Zerion
        // EIP-6963 + legacy injected-provider support
        // ============================================================

        // Keep the complete EIP-6963 detail object, not just the provider.
        // This is important because wallet identity can live in `info.rdns`.
        const discoveredProviders = new Map();

        try {
            for (const [key, detail] of (window.__earlyEIP6963Providers || new Map())) {
                if (detail?.provider && detail?.info) discoveredProviders.set(key, { info: detail.info, provider: detail.provider });
            }
        } catch (e) { console.debug("Could not import early EIP-6963 providers:", e); }

        function normalize(value) {
            return String(value ?? "").trim().toLowerCase();
        }

        function isEip6963Wallet(wallet) {
            return !!(wallet && wallet.provider && wallet.info);
        }

        function isZerionProvider(info = {}, provider = null) {
            const name = normalize(info?.name);
            const rdns = normalize(info?.rdns);

            // Zerion's common injected-provider identity is isZerion.
            // Also accept the EIP-6963 reverse-DNS identity and name.
            return !!(
                provider?.isZerion === true ||
                provider?.isZerionWallet === true ||
                rdns === "io.zerion.wallet" ||
                rdns.includes("zerion") ||
                name === "zerion" ||
                name.includes("zerion")
            );
        }

        function getWalletName(info = {}, provider = null) {
            const name = normalize(info?.name);
            const rdns = normalize(info?.rdns);
            const icon = normalize(info?.icon);

            if (isZerionProvider(info, provider)) return "Zerion";
            if (provider?.isRabby || name.includes("rabby") || rdns.includes("rabby")) return "Rabby";
            if (
                provider?.isOkxWallet ||
                provider?.isOKExWallet ||
                name.includes("okx") ||
                rdns.includes("okx")
            ) return "OKX";
            if (provider?.isMetaMask || name.includes("metamask") || rdns.includes("metamask")) return "MetaMask";

            // `icon` is intentionally not normally used for detection, but
            // it is included here so custom wallet naming still remains visible.
            void icon;
            return info?.name || "Unknown Wallet";
        }

        function registerWallet(event) {
            try {
                const detail = event?.detail || {};
                const info = detail.info || {};
                const provider = detail.provider;

                if (!provider || typeof provider.request !== "function") return;

                const wallet = {
                    info: {
                        uuid: info.uuid || "",
                        name: info.name || "",
                        icon: info.icon || "",
                        rdns: info.rdns || ""
                    },
                    provider
                };

                // Prefer UUID when present. It is the stable EIP-6963 identity
                // for the provider session. RDNS is useful as a secondary key.
                const key =
                    info.uuid ||
                    info.rdns ||
                    `${info.name || "unknown"}-${Math.random().toString(36).slice(2)}`;

                discoveredProviders.set(key, wallet);

                logEvent(
                    `Wallet discovered: ${getWalletName(wallet.info, wallet.provider)}` +
                    (info.rdns ? ` [${info.rdns}]` : ""),
                    "info"
                );
            } catch (err) {
                console.warn("EIP-6963 registration error:", err);
            }
        }

        // IMPORTANT: register the listener before requesting providers.
        window.addEventListener("eip6963:announceProvider", registerWallet, false);

        function requestWallets() {
            // Wallets that loaded before this page are required by EIP-6963
            // to announce themselves again when this request is dispatched.
            window.dispatchEvent(new Event("eip6963:requestProvider"));
        }

        function addLegacyWallet(wallets, provider, info = {}) {
            if (!provider || typeof provider.request !== "function") return;
            if (wallets.some(w => w.provider === provider)) return;

            wallets.push({
                info: {
                    uuid: info.uuid || "",
                    name: info.name || getWalletName(info, provider),
                    icon: info.icon || "",
                    rdns: info.rdns || ""
                },
                provider
            });
        }

        async function discoverWallets() {
            const deadline = Date.now() + 3500;
            while (Date.now() < deadline) {
                requestWallets();

                for (const provider of [window.zerionWallet, window.zerion, window.zerionProvider]) {
                    if (provider && typeof provider.request === "function") {
                        addLegacyWallet([], provider, { name: "Zerion", rdns: "io.zerion.wallet" });
                    }
                }

                if (
                    discoveredProviders.size > 0 ||
                    typeof window.ethereum !== "undefined" ||
                    window.zerionWallet || window.zerion || window.zerionProvider
                ) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    break;
                }
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            const wallets = [...discoveredProviders.values()];

            if (Array.isArray(window.ethereum?.providers)) {
                for (const provider of window.ethereum.providers) {
                    addLegacyWallet(wallets, provider, { name: getWalletName({}, provider) });
                }
            }

            const zerionCandidates = [
                ["zerionWallet", window.zerionWallet],
                ["zerion", window.zerion],
                ["zerionProvider", window.zerionProvider]
            ];

            for (const [globalName, provider] of zerionCandidates) {
                if (provider && typeof provider.request === "function") {
                    addLegacyWallet(wallets, provider, { name: "Zerion", rdns: "io.zerion.wallet" });
                    logEvent(`Found Zerion provider via window.${globalName}.`, "success");
                }
            }

            // Keep the legacy window.ethereum provider only when it adds a wallet
            // that EIP-6963 did not already expose. Otherwise wallets such as Rabby
            // can appear twice: once as its real EIP-6963 provider and once as the
            // generic "Injected wallet provider".
            if (window.ethereum && typeof window.ethereum.request === "function") {
                const legacyName = getWalletName({}, window.ethereum);
                const alreadyKnown = wallets.some(w => {
                    const name = getWalletName(w.info, w.provider);
                    return name === legacyName &&
                        normalize(w.info?.rdns) &&
                        w.provider !== window.ethereum;
                });

                if (!alreadyKnown) {
                    addLegacyWallet(wallets, window.ethereum, { name: legacyName });
                }
            }

            const unique = [];
            const seenProviders = new Set();
            const seenWalletIds = new Set();
            const seenWalletNames = new Set();

            for (const wallet of wallets) {
                if (!isEip6963Wallet(wallet)) continue;

                const provider = wallet.provider;
                const uuid = normalize(wallet.info?.uuid);
                const rdns = normalize(wallet.info?.rdns);
                const walletName = normalize(getWalletName(wallet.info, provider));
                const hasEip6963Identity = Boolean(uuid || rdns);

                if (seenProviders.has(provider)) continue;

                const identity = uuid || (rdns && rdns !== "unknown" ? rdns : "");
                if (identity && seenWalletIds.has(identity)) continue;

                // If EIP-6963 already supplied a proper named wallet, suppress a
                // duplicate legacy/injected entry with the same wallet name.
                if (!hasEip6963Identity && seenWalletNames.has(walletName)) continue;

                seenProviders.add(provider);
                if (identity) seenWalletIds.add(identity);
                if (walletName && walletName !== "unknown wallet") seenWalletNames.add(walletName);
                unique.push(wallet);
            }

            logEvent(
                `Wallet scan: EIP-6963=${discoveredProviders.size}, ` +
                `window.ethereum=${window.ethereum ? "YES" : "NO"}, ` +
                `ethereum.providers=${Array.isArray(window.ethereum?.providers) ? window.ethereum.providers.length : 0}, ` +
                `Zerion globals=${[window.zerionWallet, window.zerion, window.zerionProvider].filter(p => p && typeof p.request === "function").length}, ` +
                `total=${unique.length}`,
                unique.length ? "success" : "error"
            );
            return unique;
        }

        function walletIcon(info, provider) {
            const fallback = getWalletName(info, provider);
            if (info?.icon && typeof info.icon === "string") return info.icon;

            // Small inline SVG placeholders for legacy providers without EIP-6963 icons.
            const svg =
                `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">` +
                `<rect width="48" height="48" rx="12" fill="#222"/>` +
                `<text x="24" y="30" text-anchor="middle" font-size="18" fill="#fff" font-family="Arial">` +
                `${fallback.charAt(0).toUpperCase()}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function showWalletSelector(wallets) {
            return new Promise(resolve => {
                const oldModal = document.getElementById("walletSelectorModal");
                if (oldModal) oldModal.remove();

                const modal = document.createElement("div");
                modal.id = "walletSelectorModal";
                modal.style.cssText = `
                    position: fixed;
                    inset: 0;
                    z-index: 99999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: rgba(0,0,0,.78);
                    backdrop-filter: blur(8px);
                `;

                const box = document.createElement("div");
                box.style.cssText = `
                    width: min(420px, calc(100% - 32px));
                    max-height: min(80vh, 620px);
                    overflow-y: auto;
                    background: #111;
                    border: 1px solid rgba(255,80,40,.35);
                    border-radius: 20px;
                    padding: 24px;
                    box-shadow: 0 25px 80px rgba(0,0,0,.65);
                `;

                const title = document.createElement("h2");
                title.innerText = "Connect Wallet";
                title.style.cssText = `
                    color: white;
                    font-size: 22px;
                    font-weight: 800;
                    margin-bottom: 8px;
                    text-align: center;
                `;
                box.appendChild(title);

                const subtitle = document.createElement("p");
                subtitle.innerText = "Select a wallet to continue";
                subtitle.style.cssText = `
                    color: #777;
                    font-size: 13px;
                    margin-bottom: 18px;
                    text-align: center;
                `;
                box.appendChild(subtitle);

                wallets.forEach(wallet => {
                    const provider = wallet.provider;
                    const walletName = getWalletName(wallet.info, provider);

                    const button = document.createElement("button");
                    button.type = "button";
                    button.style.cssText = `
                        width: 100%;
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        padding: 12px 14px;
                        margin-bottom: 10px;
                        border-radius: 12px;
                        border: 1px solid #333;
                        background: #181818;
                        color: white;
                        font-weight: 700;
                        text-align: left;
                        cursor: pointer;
                        transition: .2s;
                    `;

                    const img = document.createElement("img");
                    img.src = walletIcon(wallet.info, provider);
                    img.alt = "";
                    img.width = 40;
                    img.height = 40;
                    img.style.cssText = "width:40px;height:40px;border-radius:10px;object-fit:cover;background:#222;";

                    const textWrap = document.createElement("div");
                    textWrap.style.cssText = "display:flex;flex-direction:column;min-width:0;";

                    const nameEl = document.createElement("span");
                    nameEl.innerText = walletName;
                    nameEl.style.cssText = "font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";

                    const metaEl = document.createElement("span");
                    metaEl.innerText = wallet.info?.rdns || "Injected wallet provider";
                    metaEl.style.cssText = "font-size:11px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";

                    textWrap.appendChild(nameEl);
                    textWrap.appendChild(metaEl);
                    button.appendChild(img);
                    button.appendChild(textWrap);

                    button.addEventListener("mouseenter", () => {
                        button.style.background = "#2a2a2a";
                        button.style.borderColor = "#ef4444";
                    });

                    button.addEventListener("mouseleave", () => {
                        button.style.background = "#181818";
                        button.style.borderColor = "#333";
                    });

                    button.addEventListener("click", () => {
                        modal.remove();
                        resolve(wallet); // Preserve BOTH info and provider.
                    });

                    box.appendChild(button);
                });

                const cancel = document.createElement("button");
                cancel.type = "button";
                cancel.innerText = "Cancel";
                cancel.style.cssText = `
                    width: 100%;
                    margin-top: 6px;
                    padding: 11px;
                    border: none;
                    background: transparent;
                    color: #777;
                    cursor: pointer;
                `;

                cancel.onclick = () => {
                    modal.remove();
                    resolve(null);
                };

                box.appendChild(cancel);
                modal.appendChild(box);
                document.body.appendChild(modal);

                modal.addEventListener("click", event => {
                    if (event.target === modal) {
                        modal.remove();
                        resolve(null);
                    }
                });
            });
        }

        // ============================================================
        // ENSURE CORRECT GENLAYER NETWORK
        // ============================================================

        async function ensureCorrectChain(provider) {
            const targetChainId = "0x" + studionet.id.toString(16);

            if (!provider || typeof provider.request !== "function") {
                throw new Error("Selected wallet provider is invalid or unavailable.");
            }

            const getChainId = () => provider.request({ method: "eth_chainId" });

            let currentChainId = await getChainId();

            if (String(currentChainId).toLowerCase() === targetChainId.toLowerCase()) {
                logEvent(`Wallet already on ${studionet.name}.`, "success");
                return;
            }

            logEvent(
                `Switching wallet from ${currentChainId} to ${targetChainId}...`,
                "warning"
            );

            try {
                await provider.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: targetChainId }]
                });
            } catch (switchError) {
                console.warn("wallet_switchEthereumChain error:", switchError);

                const message = String(switchError?.message || "").toLowerCase();
                const code = switchError?.code;
                const originalCode = switchError?.data?.originalError?.code;

                const chainNotAdded =
                    code === 4902 ||
                    originalCode === 4902 ||
                    message.includes("unrecognized chain") ||
                    message.includes("chain not added") ||
                    message.includes("has not been added");

                if (!chainNotAdded) throw switchError;

                logEvent(
                    "GenLayer network is not installed. Requesting wallet to add it...",
                    "warning"
                );

                await provider.request({
                    method: "wallet_addEthereumChain",
                    params: [{
                        chainId: targetChainId,
                        chainName: studionet.name,
                        nativeCurrency: studionet.nativeCurrency,
                        rpcUrls: studionet.rpcUrls.default.http,
                        blockExplorerUrls:
                            studionet.blockExplorers?.default?.url
                                ? [studionet.blockExplorers.default.url]
                                : []
                    }]
                });

                // Some wallets add the chain without automatically switching.
                await provider.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: targetChainId }]
                });
            }

            currentChainId = await getChainId();

            if (String(currentChainId).toLowerCase() !== targetChainId.toLowerCase()) {
                throw new Error(
                    `Wallet is still on ${currentChainId}. ` +
                    `Expected ${targetChainId} (${studionet.name}).`
                );
            }

            logEvent(
                `Wallet confirmed on ${studionet.name}.`,
                "success"
            );
        }

        // ============================================================
        // CONNECT WALLET
        // ============================================================

        // Keep the selected wallet detail so account/chain listeners are attached
        // to the exact provider the user chose (especially important with Zerion).
        let selectedWalletDetail = null;
        let providerEventHandlersAttached = false;

        function resetConnectedUI(message = "Wallet disconnected.") {
            client = null;
            userAccountAddress = null;
            selectedWalletDetail = null;
            providerEventHandlersAttached = false;

            connectBtn.innerHTML =
                '<i class="fa-solid fa-wallet"></i><span>Connect Wallet</span>';

            document.getElementById("walletInfo").classList.add("hidden");
            generateBtn.disabled = true;
            submitBtn.disabled = true;

            logEvent(message, "warning");
        }

        function attachProviderListeners(provider) {
            if (!provider?.on || providerEventHandlersAttached) return;
            providerEventHandlersAttached = true;

            provider.on("accountsChanged", accounts => {
                if (!accounts || !accounts.length) {
                    resetConnectedUI("Wallet account disconnected.");
                    return;
                }

                userAccountAddress = accounts[0];
                document.getElementById("userAddress").innerText = userAccountAddress;

                logEvent(
                    `Account changed: ${userAccountAddress.substring(0, 6)}...`,
                    "success"
                );
            });

            provider.on("chainChanged", async chainId => {
                const targetChainId = "0x" + studionet.id.toString(16);

                if (String(chainId).toLowerCase() !== targetChainId.toLowerCase()) {
                    generateBtn.disabled = true;
                    submitBtn.disabled = true;

                    logEvent(
                        `Wrong network: ${chainId}. Please switch back to ${studionet.name}.`,
                        "error"
                    );
                    return;
                }

                try {
                    await ensureCorrectChain(provider);
                    generateBtn.disabled = false;
                    submitBtn.disabled = false;
                    logEvent(
                        `Network switched back to ${studionet.name}.`,
                        "success"
                    );
                } catch (err) {
                    generateBtn.disabled = true;
                    submitBtn.disabled = true;
                    logEvent(`Network validation failed: ${err?.message || err}`, "error");
                }
            });
        }

        connectBtn.addEventListener("click", async () => {

            if (client) {
                resetConnectedUI();
                return;
            }

            try {
                logEvent("Searching for installed wallets...");

                const wallets = await discoverWallets();

                if (!wallets.length) {
                    logEvent(`No injected wallet provider found on ${window.location.origin}.`, "error");
                    logEvent(
                        "Zerion must be installed as the browser extension and allowed to access this site. " +
                        "In Chrome: Extensions → Zerion → Site access → On all sites (or allow 127.0.0.1), then reload.",
                        "warning"
                    );
                    logEvent(
                        "Diagnostic: window.ethereum=" + (window.ethereum ? "YES" : "NO") +
                        ", origin=" + window.location.origin,
                        "warning"
                    );
                    return;
                }

                logEvent(
                    `Detected ${wallets.length} wallet provider(s): ${wallets.map(w => getWalletName(w.info, w.provider)).join(", ")}`,
                    "success"
                );

                const selectedWallet = await showWalletSelector(wallets);

                if (!selectedWallet) {
                    logEvent("Wallet selection cancelled.", "warning");
                    return;
                }

                // DO NOT call getWalletName({}, provider) here.
                // Keep the original EIP-6963 info attached to the selected provider.
                selectedWalletDetail = selectedWallet;

                const provider = selectedWallet.provider;
                const selectedWalletName = getWalletName(selectedWallet.info, provider);

                logEvent(
                    `Selected wallet: ${selectedWalletName}` +
                    (selectedWallet.info?.rdns ? ` (${selectedWallet.info.rdns})` : ""),
                    "success"
                );

                const accounts = await provider.request({
                    method: "eth_requestAccounts"
                });

                if (!accounts || !accounts.length) {
                    throw new Error("Wallet returned no accounts.");
                }

                userAccountAddress = accounts[0];

                // Pass the EXACT provider selected by the user into genlayer-js.
                client = createClient({
                    chain: studionet,
                    account: userAccountAddress,
                    provider: provider
                });

                logEvent("Checking GenLayer network...", "info");
                await ensureCorrectChain(provider);

                document.getElementById("userAddress").innerText = userAccountAddress;
                document.getElementById("walletInfo").classList.remove("hidden");

                connectBtn.innerHTML =
                    '<i class="fa-solid fa-link"></i><span>Disconnect</span>';

                generateBtn.disabled = false;
                submitBtn.disabled = false;

                logEvent(
                    `Connected to ${selectedWalletName}: ${userAccountAddress.substring(0, 6)}...${userAccountAddress.substring(userAccountAddress.length - 4)}`,
                    "success"
                );

                attachProviderListeners(provider);

            } catch (err) {
                console.error("Wallet connection error:", err);
                resetConnectedUI(`Connection Failed: ${err?.message || err}`);
            }
        });

        //alert("Sending to Contract: " + CONTRACT_ADDRESS);
        generateBtn.addEventListener('click', async () => {
            const loader = document.getElementById('scenarioLoader');
            const container = document.getElementById('scenarioContainer');

            loader.classList.remove('hidden');
            container.classList.add('hidden');
            generateBtn.disabled = true;

            loader.innerText = "⏳ Sending transaction...";
            logEvent("Invoking generate_scenario...");

            try {
                const txHash = await client.writeContract({
                    address: CONTRACT_ADDRESS,
                    functionName: 'generate_scenario'
                });

                loader.innerText = "⏳ Tx Sent! Waiting for consensus...";
                logEvent(`Tx Hash: ${txHash}`);

                await client.waitForTransactionReceipt({ hash: txHash, status: TransactionStatus.ACCEPTED, timeout: 1_200_000 });

                logEvent("Scenario generated! Fetching...", "success");
                currentScenarioText = await client.readContract({
                    address: CONTRACT_ADDRESS,
                    functionName: 'get_scenario',
                    args: [userAccountAddress],
                    stateStatus: "accepted"
                });

                container.innerText = currentScenarioText;
                container.classList.remove('hidden');
            } catch (err) {
                logEvent(`Generation Failed: ${err.message}`, "error");
            } finally {
                generateBtn.disabled = false;
                loader.classList.add('hidden');
            }
        });

        submitBtn.addEventListener('click', async () => {
            const answers = document.getElementById('answersInput').value.trim();
            if (!answers) return logEvent("Please type your strategy!", "warning");

            const loader = document.getElementById('verdictLoader');
            const section = document.getElementById('verdictSection');
            const badge = document.getElementById('statusBadge');
            const log = document.getElementById('verdictLog');


            section.classList.remove('hidden');
            loader.classList.remove('hidden');
            badge.classList.add('hidden');
            log.classList.add('hidden');

            loader.innerText = "⏳ Submitting answers to blockchain...";
            logEvent("Submitting Answers...");

            try {
                const txHash = await client.writeContract({
                    address: CONTRACT_ADDRESS,
                    functionName: 'judge_survival',
                    args: [answers]
                });

                loader.innerText = "🧬 LLM is analyzing and judging your answers...";
                logEvent(`Tx Hash: ${txHash}`);

                await client.waitForTransactionReceipt({ hash: txHash, status: TransactionStatus.ACCEPTED, timeout: 1_200_000 });

                logEvent("Fetching judgment results...", "success");
                const res = await client.readContract({
                    address: CONTRACT_ADDRESS,
                    functionName: 'get_judgment',
                    args: [userAccountAddress],
                    stateStatus: "accepted"
                });

                let finalStatus = "DIED";
                let finalExplanation = res.toString();

                try {
                    const parsed = typeof res === 'string' ? JSON.parse(res) : res;
                    if (parsed.status && parsed.explanation) {
                        finalStatus = parsed.status;
                        finalExplanation = parsed.explanation;
                    } else if (res.toString().includes("SURVIVED")) {
                        finalStatus = "SURVIVED";
                    }
                } catch (e) {
                    if (res.toString().includes("SURVIVED")) finalStatus = "SURVIVED";
                }

                renderResult(finalStatus, finalExplanation);

            } catch (err) {
                logEvent(`Judgment Failed: ${err.message}`, "error");
                loader.innerText = "⚠️ Error occurred during judgment.";
            }
        });

        function renderResult(status, text) {
            document.getElementById('verdictLoader').classList.add('hidden');
            const badge = document.getElementById('statusBadge');
            const log = document.getElementById('verdictLog');
            const card = document.getElementById('verdictCard');

            badge.classList.remove('hidden');
            log.classList.remove('hidden');
            badge.innerText = status;
            log.innerText = text;

            if (status === "SURVIVED") {
                card.className = "bg-emerald-950/30 border border-emerald-500/30 rounded-3xl p-6 shadow-2xl backdrop-blur-md";
                badge.className = "text-4xl font-black tracking-tighter inline-block px-6 py-2 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            } else {
                card.className = "bg-red-950/20 border border-red-500/30 rounded-3xl p-6 shadow-2xl backdrop-blur-md";
                badge.className = "text-4xl font-black tracking-tighter inline-block px-6 py-2 rounded-2xl bg-red-500/20 text-red-400 border border-red-500/30";
            }
        }
        createLayer('stars-back', 180, 'star-back');
        createLayer('stars-mid', 120, 'star-mid');
        createLayer('stars-front', 80, 'star-front');

        function createLayer(className, count, starClass) {

            const layer = document.createElement('div');
            layer.className = className;

            for (let i = 0; i < count; i++) {

                const star = document.createElement('div');
                star.className = starClass;

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const duration = 2 + Math.random() * 6;

                const delay = Math.random() * 10;

                star.style.animation =
                    `twinkle ${duration}s infinite`;

                star.style.animationDelay =
                    `${delay}s`;
                layer.appendChild(star);
            }

            document.body.appendChild(layer);
        }


        // ===== THREE JS MARS (Full 360 Rotation & Orbit with Lights) =====
        (function () {
            const host = document.getElementById('spaceScene');
            if (!host || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(520, 520);
            renderer.setPixelRatio(window.devicePixelRatio);
            host.appendChild(renderer.domElement);

            camera.position.z = 4.1;



            const textureLoader = new THREE.TextureLoader();


            const marsTexture = textureLoader.load('public/images/mars.jpg');
            marsTexture.colorSpace = THREE.SRGBColorSpace;

            const qamarTexture = textureLoader.load('public/images/qamar.jpg');
            qamarTexture.colorSpace = THREE.SRGBColorSpace;


            const marsGeo = new THREE.SphereGeometry(1.3, 64, 64);
            const marsMat = new THREE.MeshBasicMaterial({
                map: marsTexture
            });
            const mars = new THREE.Mesh(marsGeo, marsMat);
            scene.add(mars);


            const moonGeo = new THREE.SphereGeometry(0.26, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({
                map: qamarTexture
            });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            scene.add(moon);

            let t = 0;
            function animate() {
                requestAnimationFrame(animate);
                t += 0.015;


                mars.rotation.y = t * 0.2;


                moon.rotation.y += 0.015;


                const orbitSpeed = t * 0.12;
                moon.position.x = Math.cos(orbitSpeed) * 1.8;
                moon.position.z = Math.sin(orbitSpeed) * 1.8;
                moon.position.y = Math.sin(orbitSpeed * 0.5) * 0.3;

                renderer.render(scene, camera);
            }
            animate();
        })();
        const dockIcons =
            document.querySelectorAll('.dock-icon');

        dockIcons.forEach((icon, index) => {

            icon.addEventListener('mouseenter', () => {

                if (dockIcons[index - 1]) {

                    dockIcons[index - 1].style.transform =
                        'translateY(-6px) scale(1.08)';
                }

                if (dockIcons[index + 1]) {

                    dockIcons[index + 1].style.transform =
                        'translateY(-6px) scale(1.08)';
                }
            });

            icon.addEventListener('mouseleave', () => {

                dockIcons.forEach(item => {

                    item.style.transform = '';

                });

            });

        });
    </script>
